step: chem-broken-missing-derivation
mode: reconstruction-and-simulation
description: |
  BROKEN BY CONSTRUCTION. Stage 2 output claims register
  'derived-from-measurement' but omits the 'derivation' field. The
  firewall should raise a B-class failure at parse-time.

inputs:
  - id: ../../data/smiles_seed.csv
    register: measurement

outputs:
  - id: descriptors.parquet
    register: derived-from-measurement
    # derivation field deliberately omitted — firewall must catch.
    description: |
      Should fail B-class: derivation field missing.

tests:
  - test_id: test/test_chem.py::test_02_broken_missing_derivation_raises
    description: |
      Asserts that loading this manifest raises FirewallFailure with
      class B and a message naming the missing derivation field.
