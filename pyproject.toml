[project]
name = "sakshi"
version = "0.1.0"
description = "Witness — provenance discipline for environmental-data pipelines under LLM pressure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "MāyāLucIA / sakshi" },
]
keywords = [
    "provenance",
    "scientific-software",
    "research-data-management",
    "fair",
    "llm-assisted-development",
    "environmental-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
dev = [
    "ruff>=0.3",
]

[project.entry-points.pytest11]
sakshi = "sakshi.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sakshi"]

[tool.ruff]
line-length = 88
target-version = "py311"
